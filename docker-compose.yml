services:
  android-builder:
    build: .
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
    environment:
      - JAVA_HOME=/opt/java/openjdk
      - GRADLE_USER_HOME=/home/gradle/.gradle
    working_dir: /workspace
    command: ./gradlew assembleDebug

volumes:
  gradle-cache:
